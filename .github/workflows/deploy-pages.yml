name: Deploy feet-rater to GitHub Pages

on:
  push:
    branches:
      - claude/dazzling-allen-umcddy
      - claude/financial-analyst-skill-setup-idqr6v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically if it isn't enabled yet.
          enablement: true

      - name: Upload the feet-rater app as the site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the feet-rater folder so index.html sits at the site root.
          path: feet-rater

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
